name: Build CashFlow APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Create app source files
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/cashflow-source.zip
          unzip -o /tmp/cashflow-source.zip -d .
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/cashflow/app/MainActivity.java

      - name: Download CashFlow icon from Iconify
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          curl -fL --retry 3 "https://api.iconify.design/solar/wallet-money-bold-duotone.png?width=512&height=512&color=%237b8cff" -o /tmp/cashflow-icon.png
          cp /tmp/cashflow-icon.png app/src/main/assets/app-icon.png
          cp /tmp/cashflow-icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp /tmp/cashflow-icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp /tmp/cashflow-icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp /tmp/cashflow-icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp /tmp/cashflow-icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CashFlow-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
