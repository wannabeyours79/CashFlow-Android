name: Build CashFlow APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Create app source files
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/cashflow-source.zip
          unzip -o /tmp/cashflow-source.zip -d .
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/cashflow/app/MainActivity.java

      - name: Generate CashFlow launcher icon
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF_ICON'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0A0F1E" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#7B8CFF" android:pathData="M20,32 Q20,25 28,25 H80 Q88,25 88,33 V75 Q88,83 80,83 H28 Q20,83 20,75 Z"/>
              <path android:fillColor="#C8D0FF" android:pathData="M28,37 H80 V44 H28 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M63,49 H86 Q91,49 91,55 V67 Q91,73 85,73 H63 Q54,73 54,61 Q54,49 63,49 Z"/>
              <path android:fillColor="#47E0AD" android:pathData="M67,57 A4,4 0,1 0,67 65 A4,4 0,1 0,67 57 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M36,15 L39,23 L47,26 L39,29 L36,37 L33,29 L25,26 L33,23 Z"/>
          </vector>
          EOF_ICON
          cat > app/src/main/AndroidManifest.xml <<'EOF_MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="CashFlow"
                  android:icon="@drawable/ic_launcher"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_MANIFEST
          python3 -c 'import xml.etree.ElementTree as ET; ET.parse("app/src/main/AndroidManifest.xml"); print("AndroidManifest.xml valid")'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CashFlow-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
